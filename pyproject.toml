[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "private-db-mcp"
version = "1.0.0"
description = "Local, policy-gated SQLite introspection over MCP stdio"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==1.30.0", "sqlglot==28.10.1"]

[project.scripts]
private-db-mcp = "private_db_mcp.server:main"
private-db-demo = "private_db_mcp.demo:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.14.14",
  "build==1.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["private_db_mcp"]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/private_db_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/scripts", "/README.md",
           "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/uv.lock",
           "/requirements.lock", "/.github", "/.gitignore"]
